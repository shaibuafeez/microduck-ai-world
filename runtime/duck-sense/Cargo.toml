[package]
name = "duck-sense"
description = "Look-and-decide loop: remote vision and planning, emitted as ordinary robot intents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
duck-ipc-proto = { path = "../duck-ipc-proto" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "fs"] }

# Same pin and same feature set as `updater`, which is the other crate here that talks
# to the network. One TLS stack in the image rather than two.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2", "charset", "multipart"] }
base64 = "0.22"
